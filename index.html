<!DOCTYPE html>
<html lang="it" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa Comune · Gestione Appartamenti</title>
<meta name="description" content="Portale di gestione appartamenti, bollette e affitti per studenti.">
<meta name="theme-color" content="#F4F1EC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Casa Comune">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root {
  --bg:        #F4F1EC;
  --surface:   #FFFFFF;
  --surface2:  #EAE6DE;
  --border:    #DDD8CF;
  --border2:   #C8C1B4;
  --text:      #18150F;
  --text2:     #6A6157;
  --text3:     #A49D92;
  --ink:       #18150F;
  --green:     #1A6B4A;
  --green-bg:  #E6F4EE;
  --green-bd:  #9DCFB7;
  --amber:     #A05A00;
  --amber-bg:  #FEF4E2;
  --amber-bd:  #F5C97A;
  --red:       #B01C1C;
  --red-bg:    #FDEAEA;
  --red-bd:    #F5A5A5;
  --blue:      #1648C2;
  --blue-bg:   #E8EFFE;
  --blue-bd:   #8FAAEF;
  --apt1:      #2D6A4F;
  --apt2:      #1A3A6B;
  --apt3:      #6B2D2D;
  --r:         8px;
  --r-lg:      12px;
  --r-xl:      18px;
  --shadow:    0 1px 4px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.05);
  --shadow-md: 0 4px 16px rgba(0,0,0,.10);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.14);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Sora', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%; /* Prevents font inflation on iOS landscape */
  overflow-x: hidden; /* Prevent horizontal scroll */
}
/* Prevent 300ms tap delay on mobile */
a, button, input, select, textarea, [role="button"] {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

/* ── SCREENS ─────────────────────────────────── */
.screen { display: none; min-height: 100dvh; }
.screen.active { display: block; }

/* ── LOGIN SCREEN ─────────────────────────────── */
.login-screen {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100dvh; padding: 32px 20px;
  background: var(--bg);
}
.login-logo {
  width: 60px; height: 60px;
  background: var(--ink); border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  color: var(--bg); font-size: 26px; margin-bottom: 16px;
  box-shadow: var(--shadow-md);
}
.login-title { font-size: 24px; font-weight: 700; letter-spacing: -.5px; margin-bottom: 4px; text-align: center; }
.login-sub { font-size: 13px; color: var(--text2); margin-bottom: 32px; text-align: center; }
.login-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-xl); padding: 28px 24px; width: 100%; max-width: 360px;
  box-shadow: var(--shadow-lg); min-width: 0;
}
.login-apt-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 600;
  margin-bottom: 14px; color: #fff;
}
.login-divider {
  display: flex; align-items: center; gap: 10px;
  margin: 20px 0; color: var(--text3); font-size: 12px;
}
.login-divider::before, .login-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}
.admin-link-btn {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 7px;
  font-size: 13px; color: var(--text2); cursor: pointer;
  padding: 10px 18px; border-radius: var(--r);
  border: 1px solid var(--border); background: transparent;
  transition: all .15s; font-family: 'Sora', sans-serif;
}
.admin-link-btn:hover { color: var(--text); border-color: var(--border2); background: var(--surface2); }

/* ── MAIN SHELL ──────────────────────────────── */
.shell { max-width: 700px; margin: 0 auto; padding: 0 16px 80px; }

/* ── TOPBAR ───────────────────────────────────── */
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 18px 0 16px; border-bottom: 1px solid var(--border); margin-bottom: 22px;
}
.topbar-logo {
  width: 38px; height: 38px; border-radius: var(--r-lg);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0; color: #fff;
}
.topbar-title { font-size: 16px; font-weight: 600; letter-spacing: -.2px; }
.topbar-sub   { font-size: 12px; color: var(--text2); margin-top: 1px; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.topbar-badge {
  font-size: 11px; font-weight: 600; padding: 4px 10px;
  border-radius: 99px; border: 1px solid var(--border);
  background: var(--surface2); color: var(--text2);
}
.logout-btn {
  width: 34px; height: 34px; border-radius: var(--r);
  border: 1px solid var(--border); background: var(--surface);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--text2); transition: all .15s;
}
.logout-btn:hover { background: var(--red-bg); color: var(--red); border-color: var(--red-bd); }

/* ── TABS ────────────────────────────────────── */
.tabs {
  display: flex; gap: 2px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--r-xl); padding: 4px; margin-bottom: 22px;
}
.tab {
  flex: 1; padding: 8px 4px;
  border: none; background: transparent; border-radius: var(--r);
  font-size: 12px; font-weight: 400; color: var(--text2);
  cursor: pointer; transition: all .18s;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  font-family: 'Sora', sans-serif;
}
.tab i { font-size: 14px; }
.tab.active { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
.tab:hover:not(.active) { color: var(--text); background: rgba(255,255,255,.5); }

/* ── ADMIN APT TABS ──────────────────────────── */
.apt-tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
.apt-tab {
  padding: 7px 14px; border-radius: 99px;
  border: 1.5px solid var(--border); background: var(--surface);
  font-size: 12px; font-weight: 500; cursor: pointer;
  transition: all .15s; color: var(--text2);
  font-family: 'Sora', sans-serif;
}
.apt-tab.active { color: #fff; border-color: transparent; }
.apt-tab.apt-0.active { background: var(--apt1); }
.apt-tab.apt-1.active { background: var(--apt2); }
.apt-tab.apt-2.active { background: var(--apt3); }
.apt-tab.all-tab.active { background: var(--ink); color: #fff; border-color: transparent; }

/* ── SECTIONS ─────────────────────────────────── */
.sec { display: none; }
.sec.active { display: block; }

/* ── CARDS ────────────────────────────────────── */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-xl); padding: 18px 20px;
  margin-bottom: 14px; box-shadow: var(--shadow);
}
.card-title {
  font-size: 13px; font-weight: 600; color: var(--text);
  margin-bottom: 14px; display: flex; align-items: center; gap: 7px;
}
.card-title i { color: var(--text2); font-size: 15px; }

/* ── STAT GRID ────────────────────────────────── */
.stat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 18px; }
/* Very narrow screens (320px): stack stats in a 2+1 layout */
@media (max-width: 340px) {
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .stat-grid .stat:last-child { grid-column: 1 / -1; }
}
.stat {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 14px 12px; text-align: center; box-shadow: var(--shadow);
}
.stat-val { font-size: 22px; font-weight: 700; letter-spacing: -.4px; }
.stat-lbl { font-size: 11px; color: var(--text2); margin-top: 2px; font-weight: 500; }

/* ── PROGRESS ─────────────────────────────────── */
.prog { height: 5px; background: var(--surface2); border-radius: 99px; overflow: hidden; margin: 8px 0; }
.prog-fill { height: 100%; border-radius: 99px; background: var(--green); transition: width .4s cubic-bezier(.4,0,.2,1); }

/* ── PILLS ────────────────────────────────────── */
.pills-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pill {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; border-radius: var(--r);
  border: 1px solid var(--border); background: var(--surface2); transition: all .15s;
}
.pill.paid { background: var(--green-bg); border-color: var(--green-bd); }
.pill-name { font-size: 13px; font-weight: 500; }
.pill-sub  { font-size: 11px; color: var(--text2); margin-top: 1px; }
.pill.paid .pill-name { color: var(--green); }
.pill.paid .pill-sub  { color: #2E7D5E; }
.pill-amount { font-size: 13px; font-weight: 600; color: var(--text2); }
.pill.paid .pill-amount { color: var(--green); }

/* ── BADGES ───────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 99px; font-size: 11px; font-weight: 600;
}
.badge.ok   { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-bd); }
.badge.warn { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-bd); }
.badge.err  { background: var(--red-bg);   color: var(--red);   border: 1px solid var(--red-bd); }
.badge.info { background: var(--blue-bg);  color: var(--blue);  border: 1px solid var(--blue-bd); }

/* ── ALERTS ───────────────────────────────────── */
.alert {
  display: flex; align-items: flex-start; gap: 9px;
  padding: 11px 13px; border-radius: var(--r); font-size: 13px; margin-bottom: 12px;
}
.alert i { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.alert.success { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-bd); }
.alert.error   { background: var(--red-bg);   color: var(--red);   border: 1px solid var(--red-bd); }
.alert.info    { background: var(--blue-bg);  color: var(--blue);  border: 1px solid var(--blue-bd); }
.alert.warn    { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-bd); }

/* ── FORMS ────────────────────────────────────── */
.fg { margin-bottom: 12px; }
.fg label { display: block; font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 5px; }
.fg input, .fg select, .fg textarea {
  width: 100%; padding: 9px 11px; border: 1px solid var(--border2);
  border-radius: var(--r); font-size: 14px; background: var(--surface);
  color: var(--text); font-family: 'Sora', sans-serif; transition: border-color .15s, box-shadow .15s;
}
.fg input:focus, .fg select:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(24,21,15,.08); }
.fr { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ── BUTTONS ──────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: var(--r);
  border: 1px solid var(--border2); background: var(--surface);
  color: var(--text); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all .15s; font-family: 'Sora', sans-serif;
}
.btn:hover { background: var(--surface2); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { background: #3A3530; }
.btn.danger { background: var(--red-bg); color: var(--red); border-color: var(--red-bd); }
.btn.danger:hover { background: #FCD6D6; }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

/* ── MISC ─────────────────────────────────────── */
.divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
.avatar {
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; flex-shrink: 0;
  font-family: 'JetBrains Mono', monospace;
}
.section-label {
  font-size: 11px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--text3); margin-bottom: 10px; margin-top: 4px;
}
.empty { text-align: center; padding: 36px 20px; color: var(--text2); font-size: 14px; line-height: 1.7; }
.empty i { font-size: 34px; display: block; margin: 0 auto 10px; color: var(--text3); }
.pin-input {
  font-size: 28px !important; letter-spacing: 10px !important; text-align: center !important;
  font-family: 'JetBrains Mono', monospace !important; font-weight: 500 !important;
}

/* ── RENT CARD ────────────────────────────────── */
.rent-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-xl); padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.month-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(68px,1fr)); gap: 6px; margin-top: 10px; }
.month-btn {
  padding: 7px 4px; border-radius: var(--r); border: 1px solid var(--border);
  background: var(--surface2); font-size: 11px; cursor: default; text-align: center;
  color: var(--text2); font-weight: 500; font-family: 'JetBrains Mono', monospace;
}
.month-btn.paid  { background: var(--green-bg); border-color: var(--green-bd); color: var(--green); }
.month-btn.due   { background: var(--amber-bg); border-color: var(--amber-bd); color: var(--amber); }
.month-btn.future { opacity: .42; background: var(--surface2); }
.month-btn.paid-future { opacity: 1; background: var(--blue-bg); border-color: var(--blue-bd); color: var(--blue); }
.month-btn.admin-clickable { cursor: pointer; transition: all .15s; }
.month-btn.admin-clickable:hover { transform: scale(1.06); box-shadow: 0 2px 8px rgba(0,0,0,.12); }

/* ── PILL ADMIN ACTION ────────────────────────── */
.pill-admin-btn {
  margin-top: 5px; padding: 3px 8px; border-radius: 99px; font-size: 10px; font-weight: 600;
  border: 1px solid; cursor: pointer; transition: all .15s; font-family: 'Sora', sans-serif;
  display: inline-flex; align-items: center; gap: 3px;
}
.pill-admin-btn.mark-paid  { background: var(--green-bg); color: var(--green); border-color: var(--green-bd); }
.pill-admin-btn.mark-paid:hover  { background: var(--green); color: #fff; }
.pill-admin-btn.mark-unpaid { background: var(--red-bg); color: var(--red); border-color: var(--red-bd); }
.pill-admin-btn.mark-unpaid:hover { background: var(--red); color: #fff; }

/* ── TOAST ────────────────────────────────────── */
#toast-root {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  z-index: 250; display: flex; flex-direction: column; align-items: center; gap: 8px;
  pointer-events: none; width: max-content; max-width: calc(100vw - 32px);
}
.toast {
  background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 99px;
  font-size: 13px; font-weight: 500; box-shadow: var(--shadow-lg);
  animation: toastIn .22s cubic-bezier(.34,1.56,.64,1);
  display: flex; align-items: center; gap: 7px;
  max-width: 100%; word-break: break-word; text-align: center;
}
.toast.ok  { background: var(--green); }
.toast.err { background: var(--red); }
@keyframes toastIn { from { opacity:0; transform:translateY(12px) scale(.94); } to { opacity:1; transform:translateY(0) scale(1); } }

/* ── LOG ──────────────────────────────────────── */
.log-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px;
}
.log-row:last-child { border-bottom: none; }
.log-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
.log-dot.paid  { background: var(--green); }
.log-dot.added { background: var(--blue); }
.log-dot.reset { background: var(--red); }

/* ── FOCUS VISIBLE (keyboard accessibility) ──── */
:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ── PRINT (hide interactive UI) ─────────────── */
@media print {
  .topbar, .tabs, .apt-tabs, .btn-row, #toast-root, #modal-root, #inactivity-warning { display: none !important; }
}

/* ── STUDENT DATE ROW ─────────────────────────── */
.student-date-row {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px;
}
.student-date-row:last-child { border-bottom: none; }
.quota-preview { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r); padding: 12px; margin-top: 10px; }
.quota-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }

/* ── PROP ROW ─────────────────────────────────── */
.prop-row {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px;
}
.prop-row:last-child { border-bottom: none; }

/* ── RENT TABLE ───────────────────────────────── */
.rent-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.rent-table th {
  text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .05em;
  text-transform: uppercase; color: var(--text3); padding: 6px 8px 8px;
  border-bottom: 1px solid var(--border);
}
.rent-table td {
  padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: middle;
}
.rent-table tr:last-child td { border-bottom: none; }
.rent-table tr.rt-future td { opacity: .55; }
.rent-table tr.rt-paid td { background: var(--green-bg); }
.rent-table tr.rt-due td { background: var(--amber-bg); }
.rt-input {
  width: 100%; padding: 5px 7px; font-size: 12px; font-family: 'Sora', sans-serif;
  border: 1px solid var(--border2); border-radius: var(--r); background: var(--surface);
  color: var(--text);
}
.rt-input:focus { outline: none; border-color: var(--ink); }
.rt-amt { width: 72px; }
.rt-due { width: 112px; }
.rt-status {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: 600; cursor: pointer;
  border: 1px solid; white-space: nowrap; font-family: 'Sora', sans-serif;
  background: none;
}
.rt-status.paid { background: var(--green-bg); color: var(--green); border-color: var(--green-bd); }
.rt-status.due  { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-bd); }
.rt-status.future { background: var(--blue-bg); color: var(--blue); border-color: var(--blue-bd); }
.rt-del { background: none; border: none; cursor: pointer; color: var(--text3); padding: 4px; font-size: 15px; }
.rt-del:hover { color: var(--red); }
.rent-table-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
.rt-add-row { display: flex; align-items: center; gap: 8px; padding: 10px 0 0; flex-wrap: wrap; }
.rt-collapsed { display: none; }
.rt-toggle-btn {
  display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2);
  background: none; border: none; cursor: pointer; padding: 6px 0; font-family: 'Sora', sans-serif;
}
.rt-toggle-btn:hover { color: var(--text); }
.rt-month-label { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; white-space: nowrap; }

/* ── CONTRATTO COLLASSABILE ───────────────────── */
.rt-contract-block {
  border: 1px solid var(--border); border-radius: var(--r-xl);
  margin-bottom: 10px; overflow: hidden; background: var(--surface);
  box-shadow: var(--shadow);
}
.rt-contract-header {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 14px 16px; background: var(--surface);
  border: none; cursor: pointer; text-align: left;
  font-family: 'Sora', sans-serif; transition: background .15s;
}
.rt-contract-header:hover { background: var(--surface2); }
.rt-contract-chevron { font-size: 16px; color: var(--text3); transition: transform .25s cubic-bezier(.4,0,.2,1); flex-shrink: 0; }
.rt-contract-chevron.open { transform: rotate(180deg); }
.rt-contract-body { padding: 0 16px 14px; }
.rt-contract-body.rt-collapsed { display: none; }

/* ── MY BILL CARD ─────────────────────────────── */
.my-bill-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-xl); padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow);
}
.my-bill-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }

/* ── ADMIN OVERVIEW ───────────────────────────── */
.apt-overview-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 20px; }
.apt-overview-card {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--r-xl); padding: 16px 14px; cursor: pointer;
  transition: all .18s; box-shadow: var(--shadow); position: relative; overflow: hidden;
}
.apt-overview-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
}

<script>
// ═══════════════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════════════
const SC = ['#E8F5EE','#DBEAFE','#FEF3C7','#FEE2E2','#F3E8FF','#FFF0E8'];
const ST = ['#1A7A5A','#1D4ED8','#B45309','#B91C1C','#6B21A8','#C2410C'];
const ICONS = { Luce:'⚡', Gas:'🔥', Acqua:'💧', Internet:'📶', Condominio:'🏢' };

// ── EMAILJS ────────────────────────────────────
// Sostituisci con le tue credenziali EmailJS
const EJS_SERVICE_ID  = 'YOUR_SERVICE_ID';
const EJS_TEMPLATE_ID = 'YOUR_TEMPLATE_ID';
const EJS_PUBLIC_KEY  = 'YOUR_PUBLIC_KEY';
emailjs.init(EJS_PUBLIC_KEY);

// ── TOAST ──────────────────────────────────────
function showToast(msg, type = 'ok', duration = 3000) {
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icon = document.createElement('i');
  icon.className = `ti ti-${type==='ok'?'check':'x'}`;
  el.appendChild(icon);
  el.appendChild(document.createTextNode(' ' + msg));
  root.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(), 300); }, duration);
}

async function sendEmailJSNotification(to, studentName, aptName, billType, billAmount, quota, dueDate) {
  try {
    await emailjs.send(EJS_SERVICE_ID, EJS_TEMPLATE_ID, {
      to_email:     to,
      student_name: studentName,
      apt_name:     aptName,
      bill_type:    billType,
      bill_amount:  billAmount,
      quota:        quota,
      due_date:     dueDate,
    });
    return true;
  } catch(e) { console.error('EmailJS error', e); return false; }
}

async function notifyBillToStudents(aptId, bill, students) {
  const apt = APTS.find(a=>a.id===aptId);
  const results = [];
  for (const s of students) {
    if (!s.email) continue;
    const quota = calcQuota(bill, s.id, students);
    if (quota <= 0) continue;
    const ok = await sendEmailJSNotification(
      s.email, s.name, apt.name,
      `${ICONS[bill.type]||''} ${bill.type}${bill.note?' ('+bill.note+')':''}`,
      bill.amount.toFixed(2), quota.toFixed(2), bill.due
    );
    results.push({ name: s.name, ok });
  }
  return results;
}
const MONTHS = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
const APTS = [
  { id:'basile',     name:'Via Basile',     short:'Basile',     color:'var(--apt1)', hex:'#2D6A4F', icon:'🏠' },
  { id:'marini',     name:'Via Marini',     short:'Marini',     color:'var(--apt2)', hex:'#1A3A6B', icon:'🏡' },
  { id:'crisafulli', name:'Via Crisafulli', short:'Crisafulli', color:'var(--apt3)', hex:'#6B2D2D', icon:'🏘️' },
];

// ═══════════════════════════════════════════════════════════════════════
// SUPABASE
// NOTA SICUREZZA: SB_KEY è la "anon key" pubblica di Supabase, progettata
// per essere visibile nel client. La sicurezza dei dati dipende interamente
// dalle Row Level Security (RLS) policies configurate su Supabase.
// Assicurati che le RLS siano abilitate sulla tabella app_state.

async function sbFetch(path, options = {}) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 7000);
  try {
    const res = await fetch(`${SB_URL}/rest/v1${path}`, {
      ...options,
      signal: controller.signal,
      headers: {
        'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`,
        'Content-Type': 'application/json', 'Prefer': 'return=representation',
        ...(options.headers || {})
      }
    });
    clearTimeout(timeout);
    if (!res.ok) { const e = await res.text(); throw new Error(`SB ${res.status}: ${e}`); }
    const t = await res.text();
    return t ? JSON.parse(t) : null;
  } catch(e) {
    clearTimeout(timeout);
    throw e;
  }
}

// PIN degli studenti mai esposti nel client.
// Vengono confrontati in-memory solo durante il login/confirmPay usando
// verifyStudentPin(), che legge dal cache locale temporaneo costruito
// durante loadAll() e mai accessibile dalla console o dalla rete.
const _pinCache = {}; // { aptId: { studentId: hashedPin } } — solo in RAM

async function _sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function verifyStudentPin(aptId, studentId, pinInput) {
  const cached = _pinCache[aptId]?.[studentId];
  if (!cached) return false;
  const hashed = await _sha256(pinInput);
  return hashed === cached;
}

function defAptState() {
  return { students: [], bills: [], rents: [], log: [] };
}

// Rimuove il campo pin dagli studenti prima di salvarli in aptStates,
// così non compaiono mai nelle risposte di rete o nella console.
// Gestisce la migrazione trasparente: se il PIN è già un hash SHA-256
// (64 caratteri esadecimali) lo usa direttamente; altrimenti lo hasha.
// In questo modo gli studenti già presenti nel DB continuano a funzionare
// senza dover resettare i loro PIN.
function _stripAndCachePins(aptId, state) {
  if (!state.students) return state;
  // Ricrea sempre il cache per questo apt (non preservare dati stale)
  _pinCache[aptId] = {};
  const SHA256_RE = /^[0-9a-f]{64}$/;
  state.students = state.students.map(s => {
    if (s.pin !== undefined) {
      if (SHA256_RE.test(s.pin)) {
        // Già hashato — usalo direttamente
        _pinCache[aptId][s.id] = s.pin;
      } else {
        // PIN in chiaro (dati vecchi): hasha in background
        _sha256(s.pin).then(h => { _pinCache[aptId][s.id] = h; });
      }
      const { pin: _removed, ...rest } = s;
      return rest;
    }
    return s;
  });
  return state;
}

// Flag globale: startRealtime() viene chiamata una sola volta
let _realtimeStarted = false;

function startRealtime() {
  // Evita istanze multiple di WebSocket e heartbeat duplicati
  if (_realtimeStarted) return;
  _realtimeStarted = true;

  const wsUrl = `${SB_URL.replace('https','wss')}/realtime/v1/websocket?apikey=${SB_KEY}&vsn=1.0.0`;
  let ws;

  function connect() {
    // Non aprire una nuova connessione se già aperta o in apertura
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
    try {
      ws = new WebSocket(wsUrl);
      ws.onopen = () => {
        ws.send(JSON.stringify({ topic:'realtime:public:app_state', event:'phx_join',
          payload:{ config:{ postgres_changes:[{ event:'UPDATE', schema:'public', table:'app_state' }] } }, ref:'1' }));
        setSyncStatus('live');
      };
      ws.onmessage = async (msg) => {
        try {
          const d = JSON.parse(msg.data);
          if (d.event === 'phx_reply' && d.ref === 'heartbeat') return;
          const rec = d.payload?.data?.record || d.payload?.record;
          if (rec && rec.data) {
            const rowId = rec.id;
            if (rowId === 1) { globalState = JSON.parse(rec.data); }
            else {
              const idx = rowId - 2;
              if (idx >= 0 && idx < APTS.length) {
                const aid = APTS[idx].id;
                aptStates[aid] = _stripAndCachePins(aid, JSON.parse(rec.data));
                if (!aptStates[aid].rents)    aptStates[aid].rents = [];
                if (!aptStates[aid].students) aptStates[aid].students = [];
              }
            }
            refreshCurrentScreen();
          }
        } catch(_) {}
      };
      ws.onclose = () => { setSyncStatus('error'); setTimeout(connect, 5000); };
      ws.onerror = () => { setSyncStatus('error'); };
    } catch(e) { setTimeout(connect, 5000); }
  }

  connect();

  // Heartbeat: sicuro perché ws è nella closure e aggiornato da connect()
  setInterval(() => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      try { ws.send(JSON.stringify({topic:'phoenix',event:'heartbeat',payload:{},ref:'heartbeat'})); }
      catch(_) {}
    }
  }, 25000);

  // Re-sync dati freschi quando la tab torna visibile (es. dopo sleep telefono)
  // Usa loadFresh() invece di loadAll() per non riavviare il WebSocket
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      connect(); // riconnette solo se ws è chiuso
      loadFresh().catch(() => {});
    }
  });
}

// Escape HTML per prevenire XSS nei template strings con dati utente
function escHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

// Rate limiting login: max 5 tentativi in 2 minuti
const _loginAttempts = { count: 0, resetAt: 0 };
function _checkLoginRateLimit() {
  const now = Date.now();
  if (now > _loginAttempts.resetAt) {
    _loginAttempts.count = 0;
    _loginAttempts.resetAt = now + 2 * 60 * 1000;
  }
  _loginAttempts.count++;
  return _loginAttempts.count <= 5;
}
function _loginRateLimitSeconds() {
  return Math.ceil((_loginAttempts.resetAt - Date.now()) / 1000);
}

function ts() { return new Date().toLocaleString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function fmtDate(d) { return d ? new Date(d+'T00:00:00').toLocaleDateString('it-IT') : '—'; }
function paidCount(b) { return b.payments ? Object.keys(b.payments).length : 0; }
function isPaid(b,sid) { return b.payments && b.payments[sid]; }

function calcQuota(bill, sid, students) {
  if (!bill.periodStart || !bill.periodEnd) return bill.amount / students.length;
  const pStart = new Date(bill.periodStart+'T00:00:00');
  const pEnd   = new Date(bill.periodEnd+'T00:00:00');
  const totalDays = Math.round((pEnd - pStart) / 86400000) + 1;
  if (totalDays <= 0) return 0;

  // Per ogni giorno del periodo, calcola quanti inquilini erano presenti
  // e attribuisce a ciascuno la quota 1/N di quel giorno
  const dailyCost = bill.amount / totalDays;

  // Data di ingresso effettiva dello studente target
  function entryDate(studentId) {
    const e = bill.studentDates && bill.studentDates[studentId] ? bill.studentDates[studentId] : bill.periodStart;
    const d = new Date(e+'T00:00:00');
    return d < pStart ? pStart : d;
  }

  const myEntry = entryDate(sid);
  if (myEntry > pEnd) return 0;

  let quota = 0;
  // Itera giorno per giorno
  for (let d = new Date(pStart); d <= pEnd; d.setDate(d.getDate()+1)) {
    if (d < myEntry) continue; // questo studente non era ancora presente
    // Conta quanti inquilini erano presenti in questo giorno
    const presentCount = students.filter(s => {
      const e = entryDate(s.id);
      return d >= e;
    }).length;
    if (presentCount > 0) quota += dailyCost / presentCount;
  }
  return quota;
}
// ═══════════════════════════════════════════════════════════════════════
// RENT MONTH SYSTEM
// ═══════════════════════════════════════════════════════════════════════
// Ogni mese è un oggetto: { key, amount, due, note, paid, paidTs, byAdmin }
// r.months[] è la lista persistente; getContractMonths() la arricchisce
// con i mesi auto-generati dal contratto che non sono ancora presenti,
// senza toccare quelli già personalizzati.

function _monthKey(y, m) {
  return `${y}-${String(m+1).padStart(2,'0')}`;
}
function _defaultDue(y, m) {
  // Scadenza default: 5 del mese corrente
  return `${y}-${String(m+1).padStart(2,'0')}-05`;
}

function syncContractMonths(r) {
  // Crea r.months se non esiste ancora (migrazione da vecchio formato paidMonths)
  if (!r.months) {
    r.months = [];
    // Migra paidMonths esistenti
    const oldPaid = r.paidMonths || {};
    Object.keys(oldPaid).forEach(key => {
      const [y, mo] = key.split('-').map(Number);
      r.months.push({
        key,
        amount: r.amount,
        due: _defaultDue(y, mo - 1),
        note: '',
        paid: true,
        paidTs: oldPaid[key].ts || '',
        byAdmin: !!oldPaid[key].byAdmin
      });
    });
  }

  if (!r.startDate) return r.months;

  const start = new Date(r.startDate + 'T00:00:00');
  const now   = new Date();
  // Fine: data fine contratto se impostata, altrimenti aperto — mostriamo tutto
  const endDate = r.endDate ? new Date(r.endDate + 'T00:00:00') : null;

  // Calcola l'ultimo mese da mostrare:
  // - se c'è data fine, usa quella
  // - se non c'è, mostra fino all'ultimo mese del contratto + 12 futuri
  const lastMonth = endDate
    ? new Date(endDate.getFullYear(), endDate.getMonth(), 1)
    : new Date(now.getFullYear(), now.getMonth() + 12, 1);

  let cur = new Date(start.getFullYear(), start.getMonth(), 1);
  const existingKeys = new Set(r.months.map(m => m.key));

  while (cur <= lastMonth) {
    const key = _monthKey(cur.getFullYear(), cur.getMonth());
    if (!existingKeys.has(key)) {
      r.months.push({
        key,
        amount: r.amount,
        due: _defaultDue(cur.getFullYear(), cur.getMonth()),
        note: '',
        paid: false,
        paidTs: '',
        byAdmin: false
      });
      existingKeys.add(key);
    }
    cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
  }

  // Ordina per chiave cronologica
  r.months.sort((a, b) => a.key.localeCompare(b.key));
  return r.months;
}

function getContractMonths(r) {
  // Compatibilità: usata dalla vista studente e dalle stat overview
  // Ritorna array di oggetti { key, label, future, dueDate, paid, amount, note }
  syncContractMonths(r);
  const now = new Date();
  return r.months.map(m => {
    const [y, mo] = m.key.split('-').map(Number);
    const dueDate = m.due ? new Date(m.due + 'T00:00:00') : new Date(y, mo, 5);
    const future  = now < dueDate;
    const label   = MONTHS[mo - 1] + "'" + String(y).slice(2);
    return { key: m.key, label, future, dueDate, paid: m.paid, amount: m.amount, note: m.note, paidTs: m.paidTs, byAdmin: m.byAdmin };
  });
}

function clearLoginErr() {
  document.getElementById('login-err').innerHTML = '';
}

async function doStudentLogin() {
  const nameInput = document.getElementById('login-name').value.trim();
  const pin       = document.getElementById('login-pin').value;
  const errEl     = document.getElementById('login-err');

  if (!nameInput) {
    errEl.innerHTML = `<div class="alert error"><i class="ti ti-x"></i> Inserisci il tuo nome.</div>`;
    return;
  }

  // Rate limiting
  if (!_checkLoginRateLimit()) {
    errEl.innerHTML = `<div class="alert error"><i class="ti ti-clock"></i> Troppi tentativi. Riprova tra ${_loginRateLimitSeconds()} secondi.</div>`;
    document.getElementById('login-pin').value = '';
    return;
  }

  // Se il cache è stale (>5 minuti) o il _pinCache è completamente vuoto,
  // ricarica i dati freschi da Supabase prima di procedere.
  // Questo risolve il caso "studente registrato da poco" o "pagina aperta da ore".
  const STALE_MS = 5 * 60 * 1000;
  const pinCacheEmpty = APTS.every(a => !_pinCache[a.id] || Object.keys(_pinCache[a.id]).length === 0);
  if (pinCacheEmpty || (Date.now() - _lastLoadTs) > STALE_MS) {
    errEl.innerHTML = `<div class="alert info"><i class="ti ti-loader-2 spin"></i> Aggiornamento dati in corso…</div>`;
    try { await loadFresh(); } catch(_) {}
    errEl.innerHTML = '';
  }

  // Cerca lo studente in tutti gli appartamenti (case-insensitive)
  let foundAptId = null, foundStudent = null;
  for (const apt of APTS) {
    const st = aptStates[apt.id];
    if (!st || !st.students) continue;
    const match = st.students.find(s => s.name.trim().toLowerCase() === nameInput.toLowerCase());
    if (match) { foundAptId = apt.id; foundStudent = match; break; }
  }

  // Verifica PIN — errore generico per non rivelare se il nome esiste
  const pinOk = foundStudent && await verifyStudentPin(foundAptId, foundStudent.id, pin);
  if (!pinOk) {
    errEl.innerHTML = `<div class="alert error"><i class="ti ti-x"></i> Nome o PIN non corretti. Riprova.</div>`;
    document.getElementById('login-pin').value = '';
    return;
  }

  session.role      = 'student';
  session.aptId     = foundAptId;
  session.studentId = foundStudent.id;
  resetInactivityTimer();
  renderStudentDashboard();
  showScreen('screen-student');
}

async function doAdminLogin() {
  const pin = document.getElementById('admin-pin-input').value;
  if (!globalState.adminPin) {
    document.getElementById('admin-login-err').innerHTML=`<div class="alert error"><i class="ti ti-x"></i> Connessione al server non ancora pronta. Riprova tra qualche secondo.</div>`;
    return;
  }
  // Rate limiting
  if (!_checkLoginRateLimit()) {
    document.getElementById('admin-login-err').innerHTML=`<div class="alert error"><i class="ti ti-clock"></i> Troppi tentativi. Riprova tra ${_loginRateLimitSeconds()} secondi.</div>`;
    document.getElementById('admin-pin-input').value='';
    return;
  }
  // Confronto sicuro: hash SHA-256 del PIN inserito vs hash salvato
  // Se il PIN salvato è in chiaro (vecchio formato), hashaamo entrambi
  const SHA256_RE = /^[0-9a-f]{64}$/;
  let storedHash = globalState.adminPin;
  if (!SHA256_RE.test(storedHash)) {
    // PIN ancora in chiaro nel DB — confronto diretto ma segnaliamo
    if (pin !== storedHash) {
      document.getElementById('admin-login-err').innerHTML=`<div class="alert error"><i class="ti ti-x"></i> PIN errato.</div>`;
      document.getElementById('admin-pin-input').value='';
      return;
    }
    // Migra automaticamente il PIN in hash nel DB
    const h = await _sha256(pin);
    globalState.adminPin = h;
    saveGlobal().catch(()=>{});
  } else {
    const inputHash = await _sha256(pin);
    if (inputHash !== storedHash) {
      document.getElementById('admin-login-err').innerHTML=`<div class="alert error"><i class="ti ti-x"></i> PIN errato.</div>`;
      document.getElementById('admin-pin-input').value='';
      return;
    }
  }
  session.role = 'admin';
  resetInactivityTimer();
  renderAdminAll();
  showScreen('screen-admin');
}

function renderStudentDashboard() {
  const apt = APTS.find(a=>a.id===session.aptId);
  const st  = aptStates[session.aptId];
  const sid = session.studentId;
  const s   = st.students.find(x=>x.id===sid);
  const si  = st.students.indexOf(s);

  document.getElementById('student-topbar-name').textContent = s.name;
  document.getElementById('student-topbar-apt').textContent  = apt.name;
  document.getElementById('student-topbar-logo').style.background = apt.hex;

  const myBills = st.bills.filter(b => calcQuota(b, sid, st.students) > 0);
  const paid    = myBills.filter(b => isPaid(b, sid)).length;
  const unpaid  = myBills.filter(b => !isPaid(b, sid));
  const totalPaid = myBills.filter(b=>isPaid(b,sid)).reduce((s,b)=>s+calcQuota(b,sid,st.students),0);

  document.getElementById('s-dash').innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="stat-val">${myBills.length}</div><div class="stat-lbl">Le mie bollette</div></div>
      <div class="stat"><div class="stat-val" style="color:var(--green)">${paid}</div><div class="stat-lbl">Pagate</div></div>
      <div class="stat"><div class="stat-val" style="color:${unpaid.length?'var(--amber)':'var(--green)'}">€${totalPaid.toFixed(0)}</div><div class="stat-lbl">Versati</div></div>
    </div>
    ${unpaid.length
      ? `<div class="alert warn"><i class="ti ti-alert-circle"></i> Hai <strong>${unpaid.length}</strong> bolletta${unpaid.length>1?'e':''} non pagata${unpaid.length>1?'e':''}.</div>`
      : `<div class="alert success"><i class="ti ti-check"></i> Tutte le bollette sono pagate!</div>`}
    <div class="section-label" style="margin-top:4px">Le mie bollette</div>
    ${myBills.length ? myBills.map(bill => {
      const q = calcQuota(bill, sid, st.students);
      const paid = isPaid(bill, sid);
      const hasProp = bill.periodStart && bill.periodEnd;
      return `<div class="my-bill-card">
        <div class="my-bill-head">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:22px">${ICONS[bill.type]||'📄'}</span>
            <div>
              <div style="font-weight:600;font-size:14px">${bill.type}${bill.note?` <span style="font-weight:400;font-size:12px;color:var(--text2)">— ${bill.note}</span>`:''}</div>
              <div style="font-size:12px;color:var(--text2)">Scad. ${bill.due}${hasProp?' · '+fmtDate(bill.periodStart)+'–'+fmtDate(bill.periodEnd):''}</div>
            </div>
          </div>
          <div style="text-align:right">
            <div style="font-size:16px;font-weight:700">€${q.toFixed(2)}</div>
            <span class="badge ${paid?'ok':'warn'}">${paid?'✓ Pagata':'Da pagare'}</span>
          </div>
        </div>
        ${paid ? `<div style="font-size:11px;color:var(--green)"><i class="ti ti-clock"></i> Pagato il ${bill.payments[sid].ts}</div>` : ''}
      </div>`;
    }).join('') : `<div class="empty"><i class="ti ti-file-off"></i>Nessuna bolletta.</div>`}`;

  // s-rent
  const myRent = st.rents.find(r => r.studentId === sid);
  const rentEl = document.getElementById('s-rent');
  if (!myRent) {
    rentEl.innerHTML = `<div class="empty"><i class="ti ti-home-off"></i>Nessun contratto configurato.</div>`;
  } else {
    syncContractMonths(myRent);
    const months     = myRent.months;
    const now        = new Date();
    const paidN      = months.filter(m=>m.paid).length;
    const dueMonths  = months.filter(m=>{ const d=m.due?new Date(m.due+'T00:00:00'):null; return d && d<=now; });
    const unpaidDue  = dueMonths.filter(m=>!m.paid);
    const arretrato  = unpaidDue.reduce((s,m)=>s+Number(m.amount||0),0);
    rentEl.innerHTML = `<div class="rent-card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <div class="avatar" style="background:${SC[si%SC.length]};color:${ST[si%ST.length]}">${escHtml(s.name.substring(0,2).toUpperCase())}</div>
        <div style="flex:1">
          <div style="font-size:15px;font-weight:600">${escHtml(s.name)}</div>
          <div style="font-size:12px;color:var(--text2)">${fmtDate(myRent.startDate)} → ${myRent.endDate?fmtDate(myRent.endDate):'In corso'} · €${myRent.amount.toFixed(2)}/mese base</div>
        </div>
      </div>
      <div style="display:flex;gap:16px;padding:10px 12px;background:var(--surface2);border-radius:var(--r);margin-bottom:10px">
        <div><div style="font-size:12px;color:var(--text2)">Pagati</div><div style="font-size:15px;font-weight:700;color:var(--green)">${paidN}</div></div>
        <div><div style="font-size:12px;color:var(--text2)">Scaduti</div><div style="font-size:15px;font-weight:700">${dueMonths.length}</div></div>
        <div><div style="font-size:12px;color:var(--text2)">Arretrato</div><div style="font-size:15px;font-weight:700;color:${arretrato>0?'var(--red)':'var(--green)'}">€${arretrato.toFixed(0)}</div></div>
      </div>
      <div class="month-grid" id="student-rent-grid">
        ${(() => {
          const nowKey = _monthKey(now.getFullYear(), now.getMonth());
          const pastMonthsS  = months.filter(m => m.key <= nowKey);
          const futureMonthsS= months.filter(m => m.key >  nowKey);
          function mkBtn(m) {
            const [y,mo]=m.key.split('-').map(Number);
            const label=MONTHS[mo-1]+"'"+String(y).slice(2);
            const dDate=m.due?new Date(m.due+'T00:00:00'):null;
            const isFut=dDate?now<dDate:false;
            const cls=m.paid?'paid':isFut?'future':'due';
            const sub=m.paid?'✓':('€'+Number(m.amount).toFixed(0));
            const titleTxt=m.paid?'Pagato':isFut?'Futuro':'In ritardo';
            return `<div class="month-btn ${cls}" title="${titleTxt}">${label}<br><span style="font-size:9px">${sub}</span>${m.note?`<br><span style="font-size:8px;opacity:.7">${escHtml(m.note)}</span>`:''}</div>`;
          }
          let html = pastMonthsS.map(mkBtn).join('');
          if (futureMonthsS.length) {
            html += `<div class="future-toggle-row">
              <button class="future-toggle-btn" id="fut-tog-srg" onclick="studentFutureToggle()">
                <i class="ti ti-chevron-down"></i>
                <span id="fut-lbl-srg">${futureMonthsS.length} mes${futureMonthsS.length===1?'e':'i'} futur${futureMonthsS.length===1?'o':'i'}</span>
              </button>
            </div>
            <div class="future-months-grid collapsed" id="fut-grid-srg">
              ${futureMonthsS.map(mkBtn).join('')}
            </div>`;
          }
          return html;
        })()}
      </div>
    </div>`;
  }
  renderStudentLog();
}

function renderStudentLog() {
  const st  = aptStates[session.aptId];
  const s   = st.students.find(x=>x.id===session.studentId);
  const myLog = st.log.filter(e => e.msg.includes(s.name));
  const ll  = document.getElementById('s-log');
  ll.innerHTML = `<div class="card"><div class="card-title"><i class="ti ti-history"></i> Il mio storico</div>` +
    (myLog.length ? myLog.map(e=>`<div class="log-row"><div class="log-dot ${escHtml(e.color)}"></div><div style="flex:1"><span>${escHtml(e.msg)}</span><br><span style="font-size:11px;color:var(--text2);font-family:'JetBrains Mono',monospace">${escHtml(e.ts)}</span></div></div>`).join('') : `<div class="empty" style="padding:16px 0"><i class="ti ti-mood-empty"></i>Nessun evento.</div>`)
    + `</div>`;
}

// STUDENT PAY
// ═══════════════════════════════════════════════════════════════════════
function renderStudentPay() {
  document.getElementById('s-pay-type').value = '';
  document.getElementById('s-pay-sub').innerHTML = '';
  document.getElementById('s-pay-info').innerHTML = '';
}

document.addEventListener('change', e => {
  if (e.target.id === 's-pay-type') updateStudentPaySub();
});

function updateStudentPaySub() {
  const type = document.getElementById('s-pay-type').value;
  const st   = aptStates[session.aptId];
  const sid  = session.studentId;
  const sub  = document.getElementById('s-pay-sub');
  document.getElementById('s-pay-info').innerHTML = '';
  if (!type) { sub.innerHTML=''; return; }
  if (type === 'bill') {
    const unpaid = st.bills.filter(b => !isPaid(b,sid) && calcQuota(b,sid,st.students)>0);
    if (!unpaid.length) { sub.innerHTML=`<div class="alert warn"><i class="ti ti-check"></i> Tutte le bollette sono già pagate!</div>`; return; }
    sub.innerHTML = `<div class="fg"><label>Seleziona bolletta</label>
      <select id="s-pay-bill">
        <option value="">— scegli —</option>
        ${unpaid.map(b=>`<option value="${b.id}">${ICONS[b.type]||'📄'} ${b.type}${b.note?' ('+b.note+')':''} — €${calcQuota(b,sid,st.students).toFixed(2)}</option>`).join('')}
      </select></div>`;
    document.getElementById('s-pay-bill').addEventListener('change', e => {
      const b = st.bills.find(x=>x.id===e.target.value);
      if (b) document.getElementById('s-pay-info').innerHTML = `<div class="alert info"><i class="ti ti-info-circle"></i> Quota: <strong>€${calcQuota(b,sid,st.students).toFixed(2)}</strong> · Scad. ${b.due}</div>`;
    });
  } else {
    const r = st.rents.find(x=>x.studentId===sid);
    if (!r) { sub.innerHTML=`<div class="alert warn"><i class="ti ti-info-circle"></i> Nessun contratto trovato.</div>`; return; }
    syncContractMonths(r);
    const now = new Date();
    const unpaidDue = r.months.filter(m=>{
      const d=m.due?new Date(m.due+'T00:00:00'):null;
      return d && d<=now && !m.paid;
    });
    if (!unpaidDue.length) { sub.innerHTML=`<div class="alert warn"><i class="ti ti-check"></i> Tutti i mesi già pagati!</div>`; return; }
    sub.innerHTML = `<div class="fg"><label>Mese da pagare</label>
      <select id="s-pay-month">
        <option value="">— scegli —</option>
        ${unpaidDue.map(m=>{
          const [y,mo]=m.key.split('-').map(Number);
          const label=MONTHS[mo-1]+"'"+String(y).slice(2);
          return `<option value="${m.key}">${label} — €${Number(m.amount).toFixed(2)}${m.note?' ('+m.note+')':''}`;
        }).join('')}
      </select></div>`;
    document.getElementById('s-pay-month').addEventListener('change', e => {
      const mk = e.target.value;
      const mm = r.months.find(x=>x.key===mk);
      if (mm) document.getElementById('s-pay-info').innerHTML = `<div class="alert info"><i class="ti ti-info-circle"></i> Affitto <strong>€${Number(mm.amount).toFixed(2)}</strong>${mm.note?' — '+mm.note:''} — scad. ${mm.due||'—'}</div>`;
    });
  }
}

function initStudentPay() {
  const type = document.getElementById('s-pay-type').value;
  const st   = aptStates[session.aptId];
  const sid  = session.studentId;
  if (!type) { alert('Seleziona il tipo di pagamento.'); return; }
  let desc='', amount=0;
  if (type === 'bill') {
    const bid = document.getElementById('s-pay-bill')?.value;
    if (!bid) { alert('Seleziona una bolletta.'); return; }
    const bill = st.bills.find(b=>b.id===bid);
    desc   = `bolletta ${bill.type}`;
    amount = calcQuota(bill, sid, st.students);
    pendingPay = { type:'bill', aptId:session.aptId, sid, bid };
  } else {
    const mk = document.getElementById('s-pay-month')?.value;
    if (!mk) { alert('Seleziona il mese.'); return; }
    const r = st.rents.find(x=>x.studentId===sid);
    syncContractMonths(r);
    const mm = r.months.find(x=>x.key===mk);
    desc   = `affitto ${mk}${mm&&mm.note?' ('+mm.note+')':''}`;
    amount = mm ? Number(mm.amount) : r.amount;
    pendingPay = { type:'rent', aptId:session.aptId, sid, rentId:r.id, monthKey:mk };
  }
  const s = st.students.find(x=>x.id===sid);
  showModal(`
    <div style="font-size:16px;font-weight:700;margin-bottom:4px"><i class="ti ti-lock"></i> Conferma pagamento</div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:16px">PIN per registrare <strong>€${amount.toFixed(2)}</strong> — ${desc}</div>
    <div class="fg"><label>Il tuo PIN</label>
      <input type="password" id="pin-input" class="pin-input" maxlength="4" placeholder="••••" autofocus oninput="if(this.value.length===4)confirmPay()">
    </div>
    <div id="pin-err"></div>
    <div class="btn-row"><button class="btn" onclick="closeModal()">Annulla</button></div>`);
}

async function confirmPay() {
  const pin  = document.getElementById('pin-input').value;
  const aptS = aptStates[pendingPay.aptId];
  const s    = aptS.students.find(x=>x.id===pendingPay.sid);
  const pinOk = await verifyStudentPin(pendingPay.aptId, pendingPay.sid, pin);
  if (!pinOk) {
    document.getElementById('pin-err').innerHTML = `<div class="alert error"><i class="ti ti-x"></i> PIN errato.</div>`;
    document.getElementById('pin-input').value = '';
    return;
  }
  const now = ts();
  if (pendingPay.type === 'bill') {
    const bill = aptS.bills.find(b=>b.id===pendingPay.bid);
    if (!bill.payments) bill.payments = {};
    bill.payments[pendingPay.sid] = { ts:now };
    aptS.log.unshift({ type:'paid', msg:`${s.name} ha pagato ${bill.type}${bill.note?' ('+bill.note+')':''} — €${calcQuota(bill,pendingPay.sid,aptS.students).toFixed(2)}`, ts:now, color:'paid' });
  } else {
    const r = aptS.rents.find(x=>x.id===pendingPay.rentId);
    syncContractMonths(r);
    const mm = r.months.find(x=>x.key===pendingPay.monthKey);
    if (mm) { mm.paid = true; mm.paidTs = now; mm.byAdmin = false; }
    const amt = mm ? Number(mm.amount) : r.amount;
    aptS.log.unshift({ type:'paid', msg:`${s.name} ha pagato affitto ${pendingPay.monthKey} — €${amt.toFixed(2)}`, ts:now, color:'paid' });
  }
  await saveApt(pendingPay.aptId);
  closeModal();
  renderStudentDashboard();
  swStudent('s-dash');
}

// ADMIN RENDER

function renderAdminAll() {
  renderAdminOverview();
  renderAdminAptTabs();
  renderAdminAptContent(adminAptFilter);
  renderManageTabs();
  renderManageContent(manageAptFilter);
  renderNotesTabs();
  // Solo re-renderizza notes se la tab è attiva
  const notesActive = document.getElementById('a-notes')?.classList.contains('active');
  if (notesActive) renderAdminNotes(notesAptFilter);
  renderAdminLog();
}

function renderAdminOverview() {
  const grid = document.getElementById('admin-overview-grid');
  grid.innerHTML = APTS.map((apt,i) => {
    const st = aptStates[apt.id];
    const tb = st.bills.length;
    const td = st.bills.reduce((a,b)=>a+st.students.reduce((s2,s)=>s2+calcQuota(b,s.id,st.students),0),0);
    const tc = st.bills.reduce((a,b)=>a+st.students.reduce((s2,s)=>s2+(isPaid(b,s.id)?calcQuota(b,s.id,st.students):0),0),0);
    const pct = td>0?(tc/td*100).toFixed(0):0;
    const unpaidRents = st.rents.filter(r=>{
      syncContractMonths(r);
      const now = new Date();
      return r.months.some(m=>{ const d=m.due?new Date(m.due+'T00:00:00'):null; return d&&d<=now&&!m.paid; });
    }).length;
    return `<div class="apt-overview-card c${i}" onclick="swAdmin('a-apt');setAptFilter('${apt.id}')">
      <div class="aoc-name">${apt.icon} ${apt.name}</div>
      <div class="aoc-num">${pct}%</div>
      <div class="aoc-stat" style="margin-bottom:6px">bollette saldate</div>
      <div style="font-size:11px;color:var(--text2)">${st.students.length} inquilini · ${tb} bollette</div>
      ${unpaidRents ? `<div style="margin-top:6px"><span class="badge warn"><i class="ti ti-alert-circle"></i> ${unpaidRents} affitto/i arretrato/i</span></div>` : ''}
    </div>`;
  }).join('');

  const allStudents  = APTS.reduce((a,apt)=>a+aptStates[apt.id].students.length,0);
  const allCollected = APTS.reduce((a,apt)=>a+aptStates[apt.id].bills.reduce((b,bill)=>b+aptStates[apt.id].students.reduce((c,s)=>c+(isPaid(bill,s.id)?calcQuota(bill,s.id,aptStates[apt.id].students):0),0),0),0);
  const allTotal     = APTS.reduce((a,apt)=>a+aptStates[apt.id].bills.reduce((b,bill)=>b+aptStates[apt.id].students.reduce((c,s)=>c+calcQuota(bill,s.id,aptStates[apt.id].students),0),0),0);
  document.getElementById('admin-overview-detail').innerHTML = `
    <div class="card">
      <div class="card-title"><i class="ti ti-chart-bar"></i> Riepilogo globale</div>
      <div class="stat-grid">
        <div class="stat"><div class="stat-val">${allStudents}</div><div class="stat-lbl">Inquilini totali</div></div>
        <div class="stat"><div class="stat-val">€${allCollected.toFixed(0)}</div><div class="stat-lbl">Raccolto totale</div></div>
        <div class="stat"><div class="stat-val">€${(allTotal-allCollected).toFixed(0)}</div><div class="stat-lbl">Da raccogliere</div></div>
      </div>
    </div>`;
}

function setAptFilter(aptId) {
  adminAptFilter = aptId;
  renderAdminAptTabs();
  renderAdminAptContent(aptId);
}

function renderAdminAptTabs() {
  document.getElementById('admin-apt-tabs').innerHTML =
    APTS.map((apt,i)=>`<button class="apt-tab apt-${i} ${adminAptFilter===apt.id?'active':''}" onclick="setAptFilter('${apt.id}')">${apt.icon} ${apt.short}</button>`).join('');
}

function renderAdminAptContent(aptId) {
  const st  = aptStates[aptId];
  const apt = APTS.find(a=>a.id===aptId);
  const el  = document.getElementById('admin-apt-content');

  if (!st.bills.length && !st.rents.length) {
    el.innerHTML = `<div class="empty"><i class="ti ti-building-off"></i>Nessuna bolletta né affitto per questo appartamento.</div>`; return;
  }

  const tb  = st.bills.length;
  const tc  = st.bills.reduce((a,b)=>a+st.students.reduce((s2,s)=>s2+(isPaid(b,s.id)?calcQuota(b,s.id,st.students):0),0),0);
  const td  = st.bills.reduce((a,b)=>a+st.students.reduce((s2,s)=>s2+calcQuota(b,s.id,st.students),0),0);
  const pct = td>0?(tc/td*100).toFixed(0):0;

  el.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="stat-val">${tb}</div><div class="stat-lbl">Bollette</div></div>
      <div class="stat"><div class="stat-val">€${tc.toFixed(0)}</div><div class="stat-lbl">Raccolto</div></div>
      <div class="stat"><div class="stat-val">${pct}%</div><div class="stat-lbl">Saldato</div></div>
    </div>
    ${st.bills.map(bill => {
      const pc = paidCount(bill);
      const n  = st.students.length;
      const hasProp = bill.periodStart && bill.periodEnd;
      const badge = pc===n ? `<span class="badge ok"><i class="ti ti-check"></i> Saldata</span>`
        : pc>0 ? `<span class="badge warn"><i class="ti ti-clock"></i> ${pc}/${n}</span>`
        : `<span class="badge err"><i class="ti ti-alert-circle"></i> In sospeso</span>`;
      const pills = st.students.map((s,i) => {
        const paid = isPaid(bill,s.id);
        const q = calcQuota(bill,s.id,st.students);
        const byAdmin = paid && bill.payments[s.id]?.byAdmin;
        return `<div class="pill ${paid?'paid':''}">
          <div><div class="pill-name">${escHtml(s.name)}</div><div class="pill-sub">${paid?'✓ '+escHtml(bill.payments[s.id].ts)+(byAdmin?' · admin':''):'In attesa'}</div>
          <button class="pill-admin-btn ${paid?'mark-unpaid':'mark-paid'}" onclick="adminToggleBillPaid('${escHtml(aptId)}','${escHtml(bill.id)}','${escHtml(s.id)}')">
            <i class="ti ti-${paid?'x':'check'}"></i> ${paid?'Annulla':'Segna pagato'}
          </button></div>
          <div style="text-align:right"><div class="pill-amount">€${q.toFixed(2)}</div></div>
        </div>`;
      }).join('');
      return `<div class="card">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <span style="font-size:22px">${ICONS[bill.type]||'📄'}</span>
          <div style="flex:1"><div style="font-weight:600">${bill.type}${bill.note?` — <span style="font-weight:400;font-size:12px;color:var(--text2)">${bill.note}</span>`:''}</div>
          <div style="font-size:12px;color:var(--text2)">Scad. ${bill.due}${hasProp?' · '+fmtDate(bill.periodStart)+'–'+fmtDate(bill.periodEnd):''}</div></div>
          <div style="text-align:right"><div style="font-weight:700;font-size:15px">€${bill.amount.toFixed(2)}</div>${badge}</div>
        </div>
        <div class="prog"><div class="prog-fill" style="width:${(pc/n)*100}%"></div></div>
        <div class="pills-grid" style="margin-top:8px">${pills}</div>
      </div>`;
    }).join('')}
    ${st.rents.length ? `<div class="section-label" style="margin-top:6px">Affitti</div>` + st.rents.map(r => {
      const s = st.students.find(x=>x.id===r.studentId);
      if (!s) return '';
      const si = st.students.indexOf(s);
      syncContractMonths(r);
      const now       = new Date();
      const paidN     = r.months.filter(m=>m.paid).length;
      const dueMonths = r.months.filter(m=>{ const d=m.due?new Date(m.due+'T00:00:00'):null; return d&&d<=now; });
      const arr       = dueMonths.filter(m=>!m.paid).reduce((s,m)=>s+Number(m.amount||0),0);
      const monthsHtml = r.months.map(m => {
        const [y,mo] = m.key.split('-').map(Number);
        const label  = MONTHS[mo-1]+"'"+String(y).slice(2);
        const dDate  = m.due?new Date(m.due+'T00:00:00'):null;
        const isFut  = dDate?now<dDate:false;
        const cls    = m.paid ? (isFut?'paid-future':'paid') : isFut ? 'future' : 'due';
        const sub    = m.paid ? '✓'+(m.byAdmin?' adm':'') : '€'+Number(m.amount).toFixed(0);
        const title  = m.paid ? 'Pagato — clicca per annullare' : isFut ? 'Futuro — clicca per segnare pagato in anticipo' : 'In ritardo — clicca per segnare pagato';
        return `<div class="month-btn admin-clickable ${cls}" onclick="rentMonthTogglePaid('${aptId}','${r.id}','${m.key}')" title="${title}">${label}<br><span style="font-size:9px">${sub}</span></div>`;
      }).join('');
      return `<div class="rent-card">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <div class="avatar" style="background:${SC[si%SC.length]};color:${ST[si%ST.length]}">${escHtml(s.name.substring(0,2).toUpperCase())}</div>
          <div style="flex:1">
            <div style="font-weight:600">${escHtml(s.name)}</div>
            <div style="font-size:12px;color:var(--text2)">${fmtDate(r.startDate)} → ${r.endDate?fmtDate(r.endDate):'In corso'} · €${r.amount}/mese</div>
          </div>
          <div style="text-align:right">
            <span style="font-weight:700;color:${arr>0?'var(--red)':'var(--green)'}">${arr>0?'-€'+arr.toFixed(0):'✓'}</span>
            <div style="font-size:10px;color:var(--text2)">${arr>0?'In ritardo':'In regola'}</div>
          </div>
        </div>
        <div class="month-grid">${monthsHtml}</div>
      </div>`;
    }).join('') : ''}`;
}

// ADMIN ACTIONS — AFFITTI
// ═══════════════════════════════════════════════════════════════════════
async function adminSaveRent(aptId, sid) {
  const amt   = parseFloat(document.getElementById(`ra-${aptId}-${sid}`).value);
  const start = document.getElementById(`rs-${aptId}-${sid}`).value;
  const end   = document.getElementById(`re-${aptId}-${sid}`).value;
  if (!amt||!start) { alert('Inserisci importo e data inizio.'); return; }
  const st = aptStates[aptId];
  const s  = st.students.find(x=>x.id===sid);
  const ex = st.rents.find(x=>x.studentId===sid);
  if (ex) {
    ex.amount = amt; ex.startDate = start; ex.endDate = end||null;
    // Aggiorna importo base nei mesi futuri non ancora pagati (non tocca quelli personalizzati che differiscono già)
    const nowKey = _monthKey(new Date().getFullYear(), new Date().getMonth());
    if (ex.months) ex.months.forEach(m => { if (m.key > nowKey && !m.paid) m.amount = amt; });
    syncContractMonths(ex);
  } else {
    const newRent = { id:'r'+Date.now(), studentId:sid, amount:amt, startDate:start, endDate:end||null, months:[] };
    syncContractMonths(newRent);
    st.rents.push(newRent);
  }
  st.log.unshift({ type:'added', msg:`Affitto aggiornato: ${s.name} €${amt}/mese`, ts:ts(), color:'added' });
  await saveApt(aptId); renderAdminAll();
}
async function adminDelRent(aptId, sid) {
  if (!confirm('Eliminare il contratto?')) return;
  const st = aptStates[aptId];
  const s  = st.students.find(x=>x.id===sid);
  st.rents = st.rents.filter(x=>x.studentId!==sid);
  st.log.unshift({ type:'reset', msg:`Contratto eliminato: ${s.name}`, ts:ts(), color:'reset' });
  await saveApt(aptId); renderAdminAll();
}

// ─── Mesi: toggle expand futuri ───────────────────────────────────────
function rentToggleFuture(rentId) {
  const tbody = document.getElementById(`rt-future-${rentId}`);
  const icon  = document.getElementById(`rt-icon-${rentId}`);
  if (!tbody) return;
  const open = tbody.classList.toggle('rt-collapsed') === false;
  if (icon) icon.className = open ? 'ti ti-chevron-up' : 'ti ti-chevron-down';
}

function rentTogglePaid(rentId) {
  const tbody = document.getElementById(`rt-paid-${rentId}`);
  const icon  = document.getElementById(`rt-paid-icon-${rentId}`);
  if (!tbody) return;
  const open = tbody.classList.toggle('rt-collapsed') === false;
  if (icon) icon.className = open ? 'ti ti-chevron-up' : 'ti ti-chevron-down';
}

function rentToggleContract(rentId) {
  const body  = document.getElementById(`rt-body-${rentId}`);
  const chev  = document.getElementById(`rt-chev-${rentId}`);
  if (!body) return;
  const open = body.classList.toggle('rt-collapsed') === false;
  if (chev) chev.classList.toggle('open', open);
}

// ─── Mesi: modifica campo (amount/due/note) ───────────────────────────
async function rentMonthSet(aptId, rentId, key, field, value) {
  const st = aptStates[aptId];
  const r  = st.rents.find(x=>x.id===rentId);
  if (!r) return;
  const m = r.months.find(x=>x.key===key);
  if (!m) return;
  if (field === 'amount') m.amount = parseFloat(value) || 0;
  else m[field] = value;
  await saveApt(aptId);
  // Aggiorna solo la riga corrente nel log
  const s = st.students.find(x=>x.id===r.studentId);
  // nessun log per modifiche inline — evita spam
}

// ─── Mesi: toggle pagato ─────────────────────────────────────────────
async function rentMonthTogglePaid(aptId, rentId, key) {
  const st = aptStates[aptId];
  const r  = st.rents.find(x=>x.id===rentId);
  if (!r) return;
  const m = r.months.find(x=>x.key===key);
  if (!m) return;
  const s   = st.students.find(x=>x.id===r.studentId);
  const now = ts();
  if (m.paid) {
    m.paid = false; m.paidTs = ''; m.byAdmin = false;
    st.log.unshift({ type:'reset', msg:`Affitto annullato (admin): ${s.name} — ${key}`, ts:now, color:'reset' });
    showToast(`Affitto ${key} annullato per ${s.name}`, 'err');
  } else {
    m.paid = true; m.paidTs = now; m.byAdmin = true;
    const dDate = m.due ? new Date(m.due+'T00:00:00') : null;
    const isFut = dDate ? new Date() < dDate : false;
    const msg   = isFut
      ? `Affitto segnato pagato in anticipo (admin): ${s.name} — ${key} — €${Number(m.amount).toFixed(2)}`
      : `Affitto segnato pagato (admin): ${s.name} — ${key} — €${Number(m.amount).toFixed(2)}`;
    st.log.unshift({ type:'paid', msg, ts:now, color:'paid' });
    showToast(isFut ? `${key} anticipato ✓` : `${key} segnato pagato ✓`, 'ok');
  }
  await saveApt(aptId);
  renderAdminAll();
}

function renderSDates(aptId) {
  const ps = document.getElementById(`nb-ps-${aptId}`).value;
  const pe = document.getElementById(`nb-pe-${aptId}`).value;
  const el = document.getElementById(`nb-sdates-${aptId}`);
  const st = aptStates[aptId];

  el.innerHTML = st.students.map((s,i) => {
    // Recupera la data di inizio contratto dello studente (se esiste)
    const rent = st.rents.find(r => r.studentId === s.id);
    const contractStart = rent?.startDate || null;

    // Pre-compila con la data del contratto solo se è POSTERIORE al periodo bolletta
    // (se è anteriore o uguale, lo studente era già in casa → campo vuoto = usa inizio periodo)
    let preVal = '';
    if (contractStart && ps && contractStart > ps) {
      preVal = contractStart;
    }

    const hint = contractStart
      ? `<span style="font-size:10px;color:var(--text3);margin-left:4px">contratto: ${fmtDate(contractStart)}</span>`
      : '';

    return `<div class="student-date-row">
      <div class="avatar" style="background:${SC[i%SC.length]};color:${ST[i%ST.length]};width:24px;height:24px;font-size:10px">${escHtml(s.name.substring(0,2).toUpperCase())}</div>
      <div style="flex:1;font-size:13px">${escHtml(s.name)}${hint}</div>
      <div style="font-size:12px;color:var(--text2)">Ingresso:</div>
      <input type="date" id="sd-${aptId}-${s.id}" value="${preVal}"
        ${ps?'min="'+ps+'"':''} ${pe?'max="'+pe+'"':''}
        style="padding:5px 8px;font-size:12px;border:1px solid var(--border2);border-radius:var(--r);font-family:'Sora',sans-serif;background:var(--surface);color:var(--text)"
        onchange="updateQP('${aptId}')">
    </div>`;
  }).join('');
  updateQP(aptId);
}

function updateQP(aptId) {
  const ps  = document.getElementById(`nb-ps-${aptId}`)?.value;
  const pe  = document.getElementById(`nb-pe-${aptId}`)?.value;
  const amt = parseFloat(document.getElementById(`nb-amt-${aptId}`)?.value)||0;
  const el  = document.getElementById(`nb-qp-${aptId}`);
  const st  = aptStates[aptId];
  if (!ps||!pe||!amt) { el.innerHTML=''; return; }
  const pStart    = new Date(ps+'T00:00:00');
  const pEnd      = new Date(pe+'T00:00:00');
  const totalDays = Math.round((pEnd-pStart)/86400000)+1;
  if (totalDays <= 0) { el.innerHTML=''; return; }
  const dailyCost = amt / totalDays;

  const studentDates = {};
  st.students.forEach(s => {
    const v = document.getElementById(`sd-${aptId}-${s.id}`)?.value;
    if (v) studentDates[s.id] = v;
  });

  function entryDate(sid) {
    const e = studentDates[sid] || ps;
    const d = new Date(e+'T00:00:00');
    return d < pStart ? pStart : d;
  }

  // Calcola quota per ogni studente giorno per giorno
  const quotas = {};
  st.students.forEach(s => { quotas[s.id] = 0; });
  let totalCharged = 0;

  for (let d = new Date(pStart); d <= pEnd; d.setDate(d.getDate()+1)) {
    const present = st.students.filter(s => d >= entryDate(s.id));
    if (!present.length) continue;
    const share = dailyCost / present.length;
    present.forEach(s => { quotas[s.id] += share; });
    totalCharged += dailyCost;
  }

  const uncovered = amt - totalCharged;

  const rows = st.students.map((s,i) => {
    const q    = quotas[s.id];
    const days = Math.round((pEnd - entryDate(s.id)) / 86400000) + 1;
    if (entryDate(s.id) > pEnd) return `<div class="quota-row"><span style="color:var(--text2)">${escHtml(s.name)}</span><span style="color:var(--text2)">non presente — €0</span></div>`;
    return `<div class="quota-row">
      <span style="color:${ST[i%ST.length]}">${escHtml(s.name)}</span>
      <span style="font-weight:600">€${q.toFixed(2)} <span style="font-weight:400;color:var(--text2)">(${days}gg presenti)</span></span>
    </div>`;
  });

  el.innerHTML = `<div class="quota-preview">
    <div style="font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text2);margin-bottom:8px">Anteprima quote</div>
    ${rows.join('')}
    ${uncovered > 0.005 ? `<div class="quota-row" style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border)">
      <span style="color:var(--amber)"><i class="ti ti-alert-triangle" style="font-size:11px"></i> Scoperto (proprietario)</span>
      <span style="font-weight:600;color:var(--amber)">€${uncovered.toFixed(2)}</span>
    </div>` : ''}
    <div class="quota-row" style="margin-top:4px;padding-top:4px;border-top:1px solid var(--border);font-size:11px">
      <span style="color:var(--text3)">A carico inquilini / totale bolletta</span>
      <span style="color:var(--text2)">€${(amt - uncovered).toFixed(2)} / €${amt.toFixed(2)}</span>
    </div>
  </div>`;
}
async function adminAddBill(aptId) {
  const type=document.getElementById(`nb-type-${aptId}`).value;
  const amt=parseFloat(document.getElementById(`nb-amt-${aptId}`).value);
  const due=document.getElementById(`nb-due-${aptId}`).value;
  const ps=document.getElementById(`nb-ps-${aptId}`).value;
  const pe=document.getElementById(`nb-pe-${aptId}`).value;
  const note=document.getElementById(`nb-note-${aptId}`).value.trim();
  const msgEl=document.getElementById(`nb-msg-${aptId}`);
  if(!amt||amt<=0){msgEl.innerHTML=`<div class="alert error"><i class="ti ti-x"></i> Importo non valido.</div>`;return;}
  if(!due){msgEl.innerHTML=`<div class="alert error"><i class="ti ti-x"></i> Inserisci la scadenza.</div>`;return;}
  const st=aptStates[aptId];
  const sd={};
  st.students.forEach(s=>{const v=document.getElementById(`sd-${aptId}-${s.id}`)?.value;if(v)sd[s.id]=v;});
  const dueF=new Date(due).toLocaleDateString('it-IT');
  const newBill={id:'b'+Date.now(),type,amount:amt,due:dueF,note,periodStart:ps||null,periodEnd:pe||null,studentDates:sd,payments:{}};
  st.bills.push(newBill);
  st.log.unshift({type:'added',msg:`Bolletta ${type}${note?' ('+note+')':''} — €${amt.toFixed(2)}`,ts:ts(),color:'added'});
  await saveApt(aptId);
  msgEl.innerHTML=`<div class="alert success"><i class="ti ti-check"></i> Bolletta aggiunta! Invio notifiche email…</div>`;
  [`nb-amt-${aptId}`,`nb-due-${aptId}`,`nb-note-${aptId}`,`nb-ps-${aptId}`,`nb-pe-${aptId}`].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  document.getElementById(`nb-sdates-${aptId}`).innerHTML='';
  document.getElementById(`nb-qp-${aptId}`).innerHTML='';
  renderAdminAll();
  // Invia notifiche email agli studenti con email configurata
  const studentsWithEmail = st.students.filter(s => s.email && calcQuota(newBill, s.id, st.students) > 0);
  if (studentsWithEmail.length) {
    const results = await notifyBillToStudents(aptId, newBill, st.students);
    const sent = results.filter(r=>r.ok).length;
    const failed = results.filter(r=>!r.ok).length;
    const mailMsg = sent > 0
      ? `<div class="alert success"><i class="ti ti-check"></i> Bolletta aggiunta! Email inviata a ${sent} inquilino/i${failed?` (${failed} fallita/e)`:''}</div>`
      : `<div class="alert warn"><i class="ti ti-mail-off"></i> Bolletta aggiunta, ma l'invio email non è riuscito. Controlla la configurazione EmailJS.</div>`;
    const msgEl2=document.getElementById(`nb-msg-${aptId}`);
    if(msgEl2) msgEl2.innerHTML=mailMsg;
  } else {
    const msgEl2=document.getElementById(`nb-msg-${aptId}`);
    if(msgEl2) msgEl2.innerHTML=`<div class="alert success"><i class="ti ti-check"></i> Bolletta aggiunta! (Nessun inquilino con email configurata)</div>`;
  }
  setTimeout(()=>{const m=document.getElementById(`nb-msg-${aptId}`);if(m)m.innerHTML='';},4000);
}

async function adminToggleBillPaid(aptId, billId, studentId) {
  const st   = aptStates[aptId];
  const bill = st.bills.find(x=>x.id===billId);
  const s    = st.students.find(x=>x.id===studentId);
  if (!bill || !s) return;
  if (!bill.payments) bill.payments = {};
  const now = ts();
  if (bill.payments[studentId]) {
    delete bill.payments[studentId];
    st.log.unshift({ type:'reset', msg:`Bolletta annullata (admin): ${s.name} — ${bill.type}`, ts:now, color:'reset' });
    showToast(`Pagamento annullato per ${s.name}`, 'err');
  } else {
    const q = calcQuota(bill, studentId, st.students);
    bill.payments[studentId] = { ts:now, byAdmin:true };
    st.log.unshift({ type:'paid', msg:`Bolletta segnata pagata (admin): ${s.name} — ${bill.type} — €${q.toFixed(2)}`, ts:now, color:'paid' });
    showToast(`${s.name} segnato/a come pagante ✓`, 'ok');
  }
  await saveApt(aptId);
  renderAdminAll();
}
