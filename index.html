    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <div class="card-title"><i class="ti ti-notes"></i> Appunti studenti — ${apt.icon} ${apt.name}</div>
      <p style="font-size:13px;color:var(--text2);margin-top:-4px">Annotazioni private del proprietario. Non visibili agli studenti.</p>
    </div>
    ${cards}`;
}

function notesToggle(noteKey) {
  const body = document.getElementById(`notes-body-${noteKey}`);
  const chev = document.getElementById(`notes-chev-${noteKey}`);
  if (!body) return;
  const isCollapsed = body.classList.toggle('collapsed') ;
  if (chev) chev.style.transform = isCollapsed ? '' : 'rotate(180deg)';
}

async function adminSaveNote(aptId, sid) {
  if (!globalState.studentNotes) globalState.studentNotes = {};
  const noteKey = `${aptId}_${sid}`;
  const ta = document.getElementById(`notes-ta-${noteKey}`);
  const msgEl = document.getElementById(`notes-msg-${noteKey}`);
  if (!ta) return;
  globalState.studentNotes[noteKey] = { text: ta.value, updatedTs: ts() };
  try {
    await saveGlobal();
    if (msgEl) {
      msgEl.innerHTML = `<div class="alert success"><i class="ti ti-check"></i> Appunti salvati!</div>`;
      setTimeout(() => { if (msgEl) msgEl.innerHTML = ''; renderAdminNotes(aptId); }, 2000);
    }
  } catch(e) {
    if (msgEl) msgEl.innerHTML = `<div class="alert error"><i class="ti ti-x"></i> Errore nel salvataggio.</div>`;
  }
}

async function adminClearNote(aptId, sid) {
  if (!confirm('Cancellare gli appunti per questo studente?')) return;
  if (!globalState.studentNotes) globalState.studentNotes = {};
  const noteKey = `${aptId}_${sid}`;
  delete globalState.studentNotes[noteKey];
  await saveGlobal();
  renderAdminNotes(aptId);
  showToast('Appunti cancellati', 'ok');
}

// ═══════════════════════════════════════════════════════════════════════
// ADMIN LOG
// ═══════════════════════════════════════════════════════════════════════
function renderAdminLog() {
  document.getElementById('log-apt-tabs').innerHTML =
    `<button class="apt-tab all-tab ${logAptFilter==='all'?'active':''}" onclick="setLogFilter('all')">🌐 Tutti</button>` +
    APTS.map((apt,i)=>`<button class="apt-tab apt-${i} ${logAptFilter===apt.id?'active':''}" onclick="setLogFilter('${apt.id}')">${apt.icon} ${apt.short}</button>`).join('');

  let entries = [];
  if (logAptFilter === 'all') {
    APTS.forEach(apt => {
      (aptStates[apt.id]?.log||[]).forEach(e => entries.push({ ...e, aptName:apt.name, aptColor:apt.color }));
    });
    entries.sort((a,b) => b.ts.localeCompare(a.ts));
  } else {
    entries = (aptStates[logAptFilter]?.log||[]).map(e => ({ ...e, aptName: aptName(logAptFilter), aptColor: aptColor(logAptFilter) }));
  }

  const ll = document.getElementById('admin-log-list');
  ll.innerHTML = entries.length ? entries.map(e=>`
    <div class="log-row">
      <div class="log-dot ${escHtml(e.color)}"></div>
      <div style="flex:1">
        <span>${escHtml(e.msg)}</span>
        ${logAptFilter==='all'?`<span style="font-size:10px;padding:2px 6px;border-radius:99px;background:var(--surface2);color:var(--text2);margin-left:6px">${escHtml(e.aptName)}</span>`:''}
        <br><span style="font-size:11px;color:var(--text2);font-family:'JetBrains Mono',monospace">${escHtml(e.ts)}</span>
      </div>
    </div>`).join('') : `<div class="empty" style="padding:16px 0"><i class="ti ti-mood-empty"></i>Nessun evento.</div>`;
}

function setLogFilter(v) { logAptFilter=v; renderAdminLog(); }

// ═══════════════════════════════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════════════════════════════
function showModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-root').style.display = 'flex';
  setTimeout(()=>{ const i=document.querySelector('#modal-root input'); if(i) i.focus(); },50);
}
function closeModal() { document.getElementById('modal-root').style.display='none'; pendingPay=null; }
document.getElementById('modal-root').addEventListener('click', e=>{ if(e.target.id==='modal-root') closeModal(); });

// ═══════════════════════════════════════════════════════════════════════
// INACTIVITY SESSION — logout automatico dopo 15 minuti di inattività
// ═══════════════════════════════════════════════════════════════════════
const INACTIVITY_LIMIT   = 15 * 60 * 1000; // 15 minuti
const INACTIVITY_WARNING =  2 * 60 * 1000; // avviso 2 minuti prima
let _inactivityTimer   = null;
let _warningTimer      = null;
let _warningBanner     = null;

function _dismissWarning() {
  if (_warningBanner) { _warningBanner.remove(); _warningBanner = null; }
}

function _showWarning() {
  if (!session.role) return;
  _dismissWarning();
  _warningBanner = document.createElement('div');
  _warningBanner.id = 'inactivity-warning';
  _warningBanner.innerHTML = `
    <i class="ti ti-clock-exclamation"></i>
    <span>Sessione in scadenza tra <strong>2 minuti</strong> per inattività.</span>
    <button onclick="resetInactivityTimer()" style="margin-left:auto;background:rgba(255,255,255,.25);border:none;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;color:inherit;font-family:'Sora',sans-serif">Rimani</button>
  `;
  document.body.appendChild(_warningBanner);
}

function clearInactivityTimer() {
  clearTimeout(_inactivityTimer);
  clearTimeout(_warningTimer);
  _inactivityTimer = null;
  _warningTimer    = null;
  _dismissWarning();
}

function resetInactivityTimer() {
  if (!session.role) return;
  clearInactivityTimer();
  _warningTimer    = setTimeout(_showWarning, INACTIVITY_LIMIT - INACTIVITY_WARNING);
  _inactivityTimer = setTimeout(() => {
    _dismissWarning();
    showToast('Sessione scaduta per inattività.', 'err', 4000);
    doLogout();
  }, INACTIVITY_LIMIT);
}

// Reset timer su qualsiasi interazione utente (solo se loggato)
['mousemove','keydown','touchstart','click','scroll'].forEach(ev =>
  document.addEventListener(ev, () => { if (session.role) resetInactivityTimer(); }, { passive: true })
);

loadAll().then(() => {
  showScreen('screen-login');

  showScreen('screen-login');

setTimeout(() => {
  const anyActive = document.querySelector('.screen.active');
  if (!anyActive) showScreen('screen-login');
}, 8000);
